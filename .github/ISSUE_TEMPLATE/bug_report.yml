name: 🐛 Bug Report
description: Report a bug or issue with SwiftUIDebugScan
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce and fix the issue.
  
  - type: input
    id: version
    attributes:
      label: SwiftUIDebugScan Version
      description: What version of SwiftUIDebugScan are you using?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) are you experiencing this issue on?
      multiple: true
      options:
        - iOS
        - iPadOS
        - macOS
        - tvOS
        - watchOS
        - visionOS
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode Version
      description: What version of Xcode are you using?
      placeholder: e.g., 15.0
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Swift Version
      description: What version of Swift are you using?
      placeholder: e.g., 5.9
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Add .debugScan("MyView") to a SwiftUI view
        2. Run the app in debug mode
        3. See error...
    validations:
      required: true

  - type: textarea
    id: code-sample
    attributes:
      label: Code sample
      description: Please provide a minimal code sample that demonstrates the issue
      render: swift
      placeholder: |
        import SwiftUI
        import SwiftUIDebugScan

        struct ContentView: View {
            var body: some View {
                Text("Content")
                    .debugScan("ContentView")
            }
        }
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output/logs
      description: If applicable, add console output or logs to help explain your problem
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here, including screenshots if applicable
    validations:
      required: false
